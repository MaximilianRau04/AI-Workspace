services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Persistent data
      - ./chatbot.db:/app/chatbot.db
      - ./chroma_db:/app/chroma_db
      - ./model_config.json:/app/model_config.json
      - ./mcp_servers.json:/app/mcp_servers.json
      - ./system_prompt.txt:/app/system_prompt.txt
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      # IPs of reverse proxies whose X-Forwarded-For header is trusted (e.g. "172.18.0.0/16").
      # Never use "*" while port 5000 is reachable directly: anyone could then fake
      # X-Forwarded-For and bypass the login rate limit.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - CODE_EXECUTOR_URL=http://executor:8080
      - CODE_EXECUTOR_TOKEN=${CODE_EXECUTOR_TOKEN:?Set CODE_EXECUTOR_TOKEN in .env}
    networks:
      - default
      - executor
    depends_on:
      - executor
    restart: unless-stopped

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    volumes:
      # Docker socket — only this service gets it, never the app itself
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CODE_EXECUTOR_TOKEN=${CODE_EXECUTOR_TOKEN:?Set CODE_EXECUTOR_TOKEN in .env}
      - SANDBOX_RUNTIME=${SANDBOX_RUNTIME:-}
    networks:
      - executor
    restart: unless-stopped

networks:
  executor:
    internal: true
